[metadata]
name = binvast
version = 0.1.0
description = Query-adaptive annotation for high-resolution spatial transcriptomics
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/zhangjx1996/BiNVaST
project_urls =
    Source = https://github.com/zhangjx1996/BiNVaST

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.9
install_requires =
    numpy>=1.24
    pandas>=2.0
    scikit-learn>=1.3
    torch>=2.0

[options.packages.find]
where = src

[options.entry_points]
console_scripts =
    binvast-simulate = binvast.synthetic:main
    binvast-run = binvast.workflow:main
    binvast-predict = binvast.cli:predict_main
